[package]
name = "rpgm_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.4"
once_cell = "1.19"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
anyhow = "1.0"
libc = "0.2"
