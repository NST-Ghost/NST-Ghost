[package]
name    = "renpy_rs"
version = "0.1.0"
edition = "2021"

# ── outputs ──────────────────────────────────────────────────────────────────
[lib]
# staticlib  → C FFI (.a / .lib)
# rlib       → Rust-to-Rust linking (used by the binary below)
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "renpy_extract"
path = "src/bin/main.rs"

# ── dependencies ─────────────────────────────────────────────────────────────
[dependencies]
# serialisation
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# text processing
regex      = "1.10"
once_cell  = "1.19"

# file system traversal
walkdir = "2.4"

# archive decompression (used by rpa.rs)
flate2 = "1.0"

# HTTP client (used by translator.rs)
ureq = { version = "2.9", features = ["json"] }

# C FFI helpers
libc = "0.2"

# Optional: native .rpyc decompiler (uncomment when available)
# unrpyc_rs = { path = "../unrpyc_rs" }
