[package]
name = "renpy_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "renpy_extract"
path = "POC/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.4"
once_cell = "1.19"
libc = "0.2"
flate2 = "1.0"
# unrpyc_rs = { path = "../unrpyc_rs" } # Optional: if we want to integrate native decompiler
