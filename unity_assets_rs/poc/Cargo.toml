[package]
name = "unity_assets_rs"
version = "0.2.0"
edition = "2021"
description = "Unity Asset Parser — serialized file, type tree, object reader"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
byteorder   = "1.5"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "1.0"
anyhow      = "1.0"
lz4_flex    = "0.11"
flate2      = "1.0"
indexmap    = { version = "2.0", features = ["serde"] }
